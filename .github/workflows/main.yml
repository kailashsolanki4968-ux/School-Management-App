name: Build School Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o "school-management (1).zip" -d extracted

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside school-management.zip"
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

          echo "Android project found at: $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find "${PROJECT_DIR}" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/School-Management.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Management-APK
          path: School-Management.apk
          if-no-files-found: error
