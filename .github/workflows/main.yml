name: Build School Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Android project ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | head -n 200
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -n 200

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              | head -n 1)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: Android Gradle project was not found."
              find extracted -maxdepth 6 -type f | head -n 300
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Building Android project..."
          echo "Project directory: $PWD"

          echo "Project files:"
          ls -la

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \)

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."

            echo "Searching all APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" || true

            echo "Build output directories:"
            find "$PROJECT_DIR" -type d -path "*/build/outputs*" || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/School-Management.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Management-APK
          path: School-Management.apk
          if-no-files-found: error
